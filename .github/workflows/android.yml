
name: AETHER Android Build

on:
  push:
    branches:
      - main
    paths:
      - AETHER_ANDROID_PROJECT.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android project archive
        run: test -f AETHER_ANDROID_PROJECT.zip

      - name: Extract Android project
        run: unzip -q AETHER_ANDROID_PROJECT.zip -d android-project

      - name: Build debug APK
        working-directory: android-project/AETHER_ANDROID_PROJECT
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-debug-APK
          path: android-project/AETHER_ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
